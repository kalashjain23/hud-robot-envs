[project]
name = "hud-robot-envs"
version = "0.1.0"
description = "Robot envs and tasks driven through HUD robot control interfaces"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dreamscale==0.1.0a262",
    "hud[robot]",
    "mujoco>=3.2",
    "numpy>=1.26",
]

[tool.uv.sources]
hud = { git = "https://github.com/kalashjain23/hud-python", branch = "feat/robot-control-interfaces" }

[tool.uv]
package = false

[tool.ruff]
line-length = 100
